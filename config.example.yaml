# 실험 데이터 자동 정리 설정 파일 예시
# 사용법: python main.py --config config.yaml
# (복사해서 config.yaml 로 저장한 뒤 아래 값을 실제 데이터에 맞게 수정하세요)

# raw data 엑셀 파일 경로
raw_data_path: data/raw_data_example.xlsx

# raw data가 들어 있는 시트명 또는 인덱스 (0 = 첫 번째 시트)
sheet_name: 0

# 기준(reference) 샘플명 - raw data의 샘플명과 정확히 일치해야 함
reference: REF

# 비교하고 싶은 샘플명 목록
samples:
  - A-01
  - A-02
  - A-03

# 결과 보고서 저장 경로
output_path: output/report.xlsx

# (선택) raw data의 컬럼명이 기본 형식과 다를 때 직접 매핑
# 지정하지 않으면 "샘플/Sample", "TSC", "RTVM", "Mn", "Mw", "PDI" 등의
# 이름으로 시작하는 컬럼을 자동으로 찾습니다.
# column_map:
#   sample: "시료명"
#   TSC: "TSC(wt%)"
#   RTVM: "RTVM(cps)"
#   Mn: "Mn"
#   Mw: "Mw"
#   PDI: "PDI"
